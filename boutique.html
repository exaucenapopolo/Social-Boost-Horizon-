<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Boutique</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <!-- Polices et Icônes -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <style>
    /* Variables dynamiques */
    :root {
      --bg: #F8F9FA;
      --text: #212529;
      --card: #FFFFFF;
      --border: rgba(0,0,0,0.1);
      --accent: #F0A500;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 0; overflow-x: hidden; transition: 0.3s; }

    /* Header Boutique */
    .store-header {
      text-align: center; padding: 40px 20px 20px;
      background: var(--card); border-bottom: 1px solid var(--border);
    }
    .logo { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); margin-bottom: 10px; display: none; background: #fff;}
    .title { font-size: 1.5rem; margin: 0; font-weight: 700; }
    .slogan { font-size: 0.9rem; opacity: 0.7; margin-top: 5px; }
    .desc { font-size: 0.95rem; padding: 20px; text-align: center; line-height: 1.5; max-width: 600px; margin: 0 auto; opacity: 0.9;}

    /* Contenu */
    .container { max-width: 800px; margin: 0 auto; padding: 15px; }
    .platform-title { font-size: 0.85rem; text-transform: uppercase; font-weight: 700; margin: 25px 0 10px 0; opacity: 0.6; }
    
    .service-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .service-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;}
    .service-name { font-weight: 600; font-size: 0.95rem; line-height: 1.3;}
    .service-price { color: var(--accent); font-weight: 800; font-size: 1.2rem; white-space: nowrap;}
    .service-unit { font-size: 0.75rem; opacity: 0.6; font-weight: 500;}

    .btn-buy {
      width: 100%; padding: 12px; border-radius: 8px; border: none; cursor: pointer;
      background: var(--accent); color: #fff; font-weight: 700; font-size: 1rem;
      display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn-buy:hover { opacity: 0.9; }

    #loader { text-align: center; padding: 100px 20px; font-weight: 600; color: var(--accent); }
    #storeContent { display: none; }

    /* Modale de Commande CSS statique pour la propreté */
    #orderModalOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    .order-modal { background: var(--card); border: 1px solid var(--border); border-radius: 15px; width: 92%; max-width: 450px; padding: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); max-height: 90vh; overflow-y: auto; }
    .order-modal h3 { margin-top: 0; margin-bottom: 20px; font-size: 1.15rem; color: var(--text); line-height: 1.3;}
    .order-modal label { font-size: 0.85rem; font-weight: 700; opacity: 0.85; display: block; margin-bottom: 6px; color: var(--text); }
    .order-modal input, .order-modal textarea { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 2px solid var(--border); background: var(--bg); color: var(--text); font-family: inherit; font-size: 0.95rem; transition: border-color 0.2s ease; }
    .order-modal input:focus, .order-modal textarea:focus { outline: none; border-color: var(--accent); }
    .order-modal .price-display { font-size: 1.5rem; font-weight: 800; color: var(--accent); margin-bottom: 20px; text-align: center; }
    .order-modal .btn-confirm { width: 100%; padding: 14px; border-radius: 8px; border: none; cursor: pointer; background: var(--accent); color: #fff; font-weight: 700; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
    .order-modal .btn-cancel { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; background: transparent; color: var(--text); font-weight: 600; font-size: 1rem; }

    /* Bouton Flottant WhatsApp */
    .whatsapp-float {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25d366;
      color: white;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      display: none; /* Masqué par défaut, affiché si la boutique a un numéro */
      justify-content: center;
      align-items: center;
      font-size: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 1000;
      text-decoration: none;
      transition: transform 0.3s ease;
    }
    .whatsapp-float:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <div id="loader"><i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Chargement de la boutique...</div>

  <!-- Contenu Principal -->
  <div id="storeContent">
    <div class="store-header">
      <img id="sLogo" class="logo" src="" alt="Logo">
      <h1 id="sTitle" class="title">Boutique</h1>
      <div id="sSlogan" class="slogan"></div>
    </div>
    
    <div id="sDesc" class="desc"></div>

    <div class="container" id="catalog">
      <!-- Les services de la base de données seront injectés ici -->
    </div>
  </div>

  <!-- Bouton WhatsApp Flottant -->
  <a href="#" id="waFloatBtn" class="whatsapp-float" target="_blank" title="Contacter le support">
    <i class="fab fa-whatsapp"></i>
  </a>

  <!-- Modale de Commande (Gérée en pur JS, sans redirection) -->
  <div id="orderModalOverlay">
    <div class="order-modal">
      <h3 id="modalServiceName">Nom du Service</h3>
      <form id="orderForm">
        <label>Lien / URL cible</label>
        <input type="url" id="modalLink" placeholder="https://..." required>
        
        <label>Quantité</label>
        <input type="number" id="modalQty" min="1" required>
        <small id="modalMinMax" style="display:block; margin-top:-10px; margin-bottom:15px; opacity:0.6;"></small>

        <label>Ton Contact (Optionnel, pour le suivi)</label>
        <input type="text" id="modalContact" placeholder="Email ou Numéro WhatsApp">

        <div class="price-display" id="modalPrice">0 FCFA</div>
        
        <button type="submit" class="btn-confirm" id="btnConfirmOrder">
          <i class="fas fa-paper-plane"></i> Commander
        </button>
        <button type="button" class="btn-cancel" onclick="closeOrderModal()">Annuler</button>
      </form>
    </div>
  </div>

  <script>
    // 1. Initialisation de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyD2JiDS0g8EkeNXxjO7_wGI3WznpPvcCCk",
      projectId: "social-boost-horizon",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const params = new URLSearchParams(window.location.search);
    const storeId = params.get('id'); // L'ID du revendeur

    // 2. URL du backend de ton serveur
    const BACKEND_URL = 'https://socialboosthorizon.com/'; // Ajoute l'URL de ton backend ici

    let storeData = null;
    let resellerWa = "";
    let resellerDiscount = 0; // Au cas où tu appliques des remises
    
    let currentSelectedService = null;

    // 3. Configuration des Devises (Répliquée du fichier modèle)
    const CURRENCY_CONFIG = {
        'cm': { code: 'XAF', symbol: 'FCFA', rate: 1, flag: '🇨🇲' },
        'cd': { code: 'CDF', symbol: 'FC', rate: 4.27, flag: '🇨🇩' },
        'sn': { code: 'XOF', symbol: 'FCFA', rate: 1, flag: '🇸🇳' },
        'ci': { code: 'XOF', symbol: 'FCFA', rate: 1, flag: '🇨🇮' },
        'Cameroun': { code: 'XAF', symbol: 'FCFA', rate: 1, flag: '🇨🇲' },
        'RDC': { code: 'CDF', symbol: 'FC', rate: 4.27, flag: '🇨🇩' },
        'Sénégal': { code: 'XOF', symbol: 'FCFA', rate: 1, flag: '🇸🇳' },
        'Côte d\'Ivoire': { code: 'XOF', symbol: 'FCFA', rate: 1, flag: '🇨🇮' }
    };
    let userCurrency = CURRENCY_CONFIG['Cameroun']; // Devise par défaut

    // Fonctions de conversion et de formatage
    function convertFromXAF(amountXAF) {
        return amountXAF * userCurrency.rate;
    }

    function formatPrice(amountXAF) {
        const localAmount = convertFromXAF(amountXAF);
        if (userCurrency.rate === 1) {
            return new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(Math.round(localAmount)) + ' ' + userCurrency.symbol;
        } else {
            return new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(localAmount) + ' ' + userCurrency.symbol;
        }
    }

    // 4. Initialisation de la page de la boutique
    async function loadStore() {
        if (!storeId) {
            document.getElementById('loader').innerHTML = "Erreur : ID de la boutique introuvable.";
            return;
        }

        try {
            // Requête Firebase pour récupérer la boutique
            const storeDoc = await db.collection('stores').doc(storeId).get();
            if (!storeDoc.exists) {
                document.getElementById('loader').innerHTML = "Boutique inexistante ou désactivée.";
                return;
            }

            storeData = storeDoc.data();
            
            // Appliquer les données de la boutique
            if(storeData.logo) {
                document.getElementById('sLogo').src = storeData.logo;
                document.getElementById('sLogo').style.display = 'inline-block';
            }
            document.getElementById('sTitle').textContent = storeData.name || "Boutique";
            document.getElementById('sSlogan').textContent = storeData.slogan || "";
            document.getElementById('sDesc').textContent = storeData.description || "";
            
            // Appliquer les thèmes de la boutique
            if (storeData.theme) {
                document.documentElement.style.setProperty('--bg', storeData.theme.bg || '#F8F9FA');
                document.documentElement.style.setProperty('--card', storeData.theme.card || '#FFFFFF');
                document.documentElement.style.setProperty('--text', storeData.theme.text || '#212529');
                document.documentElement.style.setProperty('--accent', storeData.theme.accent || '#F0A500');
            }

            // Gestion du numéro WhatsApp pour le bouton flottant (PAS pour la commande)
            if (storeData.whatsapp) {
                resellerWa = storeData.whatsapp.replace(/\D/g, ''); // Nettoie le numéro
                const waBtn = document.getElementById('waFloatBtn');
                waBtn.href = `https://wa.me/${resellerWa}`;
                waBtn.style.display = 'flex'; // Affiche le bouton
            }

            // Charger les services de l'API / Base de données
            await fetchCatalog();

            document.getElementById('loader').style.display = 'none';
            document.getElementById('storeContent').style.display = 'block';

        } catch (error) {
            console.error("Erreur lors du chargement :", error);
            document.getElementById('loader').innerHTML = "Une erreur s'est produite lors du chargement.";
        }
    }

    // 5. Récupération des services
    async function fetchCatalog() {
        // Remplacer par ton véritable appel API pour lister les services
        const catalogContainer = document.getElementById('catalog');
        
        try {
            const response = await fetch(`${BACKEND_URL}/api/exo-services`);
            const data = await response.json();

            if (!data.success) throw new Error('Erreur de chargement des services');

            // Logique de rendu de ton catalogue (Simplifiée pour l'exemple)
            const platforms = data.platforms;
            catalogContainer.innerHTML = '';

            Object.keys(platforms).forEach(platform => {
                if (platforms[platform] && platforms[platform].length > 0) {
                    
                    const pTitle = document.createElement('div');
                    pTitle.className = 'platform-title';
                    pTitle.textContent = platform;
                    catalogContainer.appendChild(pTitle);

                    platforms[platform].forEach(service => {
                        // Création de la carte du service
                        const card = document.createElement('div');
                        card.className = 'service-card';
                        
                        const isPerUnit = service.isPerOne || service.isPackage;
                        const priceDisplay = formatPrice(service.priceXAF);
                        const unitDisplay = isPerUnit ? "/ unité" : "/ 1000";

                        card.innerHTML = `
                            <div class="service-header">
                                <div class="service-name">${service.name}</div>
                                <div style="text-align:right">
                                    <div class="service-price">${priceDisplay}</div>
                                    <div class="service-unit">${unitDisplay}</div>
                                </div>
                            </div>
                            <button class="btn-buy" onclick='openOrderModal(${JSON.stringify(service)})'>
                                <i class="fas fa-shopping-cart"></i> Commander
                            </button>
                        `;
                        catalogContainer.appendChild(card);
                    });
                }
            });
        } catch (error) {
            catalogContainer.innerHTML = "<p style='text-align:center;'>Impossible de charger les services pour le moment.</p>";
        }
    }

    // 6. Gestion de la Modale et des Commandes
    function openOrderModal(service) {
        currentSelectedService = service;
        
        document.getElementById('modalServiceName').textContent = service.name;
        document.getElementById('modalQty').min = service.min || 1;
        document.getElementById('modalQty').value = service.min || 1;
        document.getElementById('modalMinMax').textContent = `Min: ${service.min} | Max: ${service.max}`;
        document.getElementById('modalLink').value = '';
        
        updateModalPrice();
        document.getElementById('orderModalOverlay').style.display = 'flex';
    }

    function closeOrderModal() {
        document.getElementById('orderModalOverlay').style.display = 'none';
        currentSelectedService = null;
    }

    // Calcul du prix dynamique dans la modale
    document.getElementById('modalQty').addEventListener('input', updateModalPrice);
    
    function updateModalPrice() {
        if (!currentSelectedService) return;
        
        const qty = parseInt(document.getElementById('modalQty').value) || 0;
        const isPerUnit = currentSelectedService.isPerOne || currentSelectedService.isPackage;
        
        let total = isPerUnit ? 
            (currentSelectedService.priceXAF * qty) : 
            ((currentSelectedService.priceXAF / 1000) * qty);

        document.getElementById('modalPrice').textContent = formatPrice(Math.round(total));
    }

    // Envoi direct de la commande au serveur (API)
    document.getElementById('orderForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        if (!currentSelectedService) return;

        const link = document.getElementById('modalLink').value;
        const qty = parseInt(document.getElementById('modalQty').value);
        const contact = document.getElementById('modalContact').value;
        const btn = document.getElementById('btnConfirmOrder');

        // Validation basique
        if (qty < currentSelectedService.min || qty > currentSelectedService.max) {
            alert(`La quantité doit être comprise entre ${currentSelectedService.min} et ${currentSelectedService.max}`);
            return;
        }

        // État de chargement
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Traitement...';

        try {
            // La payload structurée exactement comme le backend l'attend
            const payload = {
                storeId: storeId, // Permet au serveur de savoir pour quelle boutique c'est
                exoServiceId: currentSelectedService.id,
                link: link,
                quantity: qty,
                contactType: contact.includes('@') ? 'email' : 'whatsapp',
                contact: contact || null,
                isGuest: true // Optionnel : indique à ton backend que l'utilisateur n'est pas connecté via auth
            };

            const res = await fetch(`${BACKEND_URL}/api/order-exo`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                // Pas besoin de Bearer token si l'utilisateur de la boutique n'a pas besoin de créer de compte
                body: JSON.stringify(payload)
            });

            const result = await res.json();

            if (result.success) {
                alert(`✅ Commande réussie !\n\nID: ${result.orderId}`);
                closeOrderModal();
            } else {
                alert(`❌ Erreur: ${result.error}`);
            }
        } catch (error) {
            console.error(error);
            alert("Erreur de connexion au serveur. Vérifie ta connexion.");
        } finally {
            // Remise à zéro du bouton
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Commander';
        }
    });

    // Lancer le chargement au démarrage
    loadStore();
  </script>
</body>
</html>
